# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/

# Project name
name = "homehub"

# Pages build output directory
pages_build_output_dir = "dist"

# KV worker reached over a service binding by functions/kv/* and functions/api/logs.ts.
# The worker has no public URL; Cloudflare Access protects this Pages site.
[[services]]
binding = "KV_API"
service = "homehub-kv-worker"

# Arlo proxy worker reached over a service binding by functions/api/arlo/*.
# It holds the Arlo session token server-side; the browser never receives it.
[[services]]
binding = "ARLO_PROXY"
service = "homehub-arlo-proxy"
