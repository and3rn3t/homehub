name = "homehub-kv-worker"
main = "src/index.ts"
compatibility_date = "2024-10-09"

# Only reachable through the Pages Function service binding (see docs/deployment/SECURITY.md).
# Do not deploy this until the Pages Function + Access app are in place, or the app loses its backend.
workers_dev = false

# KV Namespace Bindings
[[kv_namespaces]]
binding = "HOMEHUB_KV"
id = "13b0979fda8e4bd0a581f4b4ddd9b92f"
preview_id = "9316570aa53747fcbae0f8f90d126408"

[[kv_namespaces]]
binding = "LOGS_KV"
id = "a4a51b7c589046ea8c42f23711ab1582"
preview_id = "6f723c57974d49fb980b1f57563e56a0"

# Non-secret auth config. Set ACCESS_TEAM_DOMAIN and ACCESS_AUD from Zero Trust > Access > Applications.
# Requests are rejected (401) unless they carry a valid Access JWT or the AUTH_TOKEN service token.
[vars]
ACCESS_TEAM_DOMAIN = "and3rn3t.cloudflareaccess.com"
# The AUD tag is a public audience identifier (it appears in every Access login URL and JWT), not a secret.
ACCESS_AUD = "44d635e32405bd0f93ecb0c5d248ccf09ae509afaa0151a13ab82165e8e7671e" # gitleaks:allow
ALLOWED_ORIGINS = "http://localhost:5173"

# Rate limit for POST/DELETE (per client IP)
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Worker settings
[build]
command = "npm run build"

# NOTE: named environments do not inherit vars or bindings (KV, rate limit), so the auth config above
# only applies to the default environment. Deploy with `npm run deploy` (default env). An environment
# deployed without ACCESS_* vars fails closed (every request except /health returns 401).
[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }
